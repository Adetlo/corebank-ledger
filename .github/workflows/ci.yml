name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: corebank
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: corebank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corebank -d corebank_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://corebank:ci_only_password@localhost:5432/corebank_test
      DATABASE_URL: postgresql+psycopg://corebank:ci_only_password@localhost:5432/corebank_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Dependency and code security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict --desc on

      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r src -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: corebank-ledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=corebank -e POSTGRES_PASSWORD=ci_only_password -e POSTGRES_DB=corebank \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U corebank -d corebank && break; sleep 1; done
          docker run -d --name api --network ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://corebank:ci_only_password@pg:5432/corebank \
            corebank-ledger:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && break; sleep 1; done
          curl -fsS http://localhost:8000/health/ready
          docker logs api
